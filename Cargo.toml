[package]
name = "servinel"
version = "0.0.6"
edition = "2024"
authors = ["Rashikraj Shrestha <rashik123.rs@gmail.com>"]
description = "Service manager and supervisor with TUI dashboard"
license = "MIT"
homepage = "https://github.com/Rashik-raj/servinel"
repository = "https://github.com/Rashik-raj/servinel"
keywords = ["service", "manager", "supervisor", "tui", "dashboard"]
categories = ["command-line-utilities", "development-tools"]


[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
ratatui = "0.30.0"
crossterm = "0.29.0"
sysinfo = "0.38.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.18"

clap_complete = "4.6.3"
libc = "0.2.186"
futures = "0.3.32"
arboard = "3.6.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
